# Local disposable QA only. Synthetic resource identities cannot target retained or hosted resources.
name = "tirak-core-qa-local"
main = "src/index.ts"
account_id = "00000000000000000000000000000000"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "tirak-core-qa-local"
database_id = "11111111-1111-4111-8111-111111111111"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "tirak-core-qa-local"

[[kv_namespaces]]
binding = "CACHE"
id = "22222222222222222222222222222222"

[[kv_namespaces]]
binding = "SESSIONS"
id = "33333333333333333333333333333333"

[[queues.producers]]
binding = "MODERATION_QUEUE"
queue = "tirak-core-qa-moderation-local"

[[queues.producers]]
binding = "ANALYTICS_QUEUE"
queue = "tirak-core-qa-analytics-local"

[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "tirak-core-qa-notification-local"

[[queues.consumers]]
queue = "tirak-core-qa-moderation-local"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

[[queues.consumers]]
queue = "tirak-core-qa-analytics-local"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

[[queues.consumers]]
queue = "tirak-core-qa-notification-local"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[durable_objects.bindings]]
name = "NOTIFICATION_SERVICE"
class_name = "NotificationService"

[[migrations]]
tag = "core-qa-v1"
new_sqlite_classes = ["ChatRoom", "NotificationService"]

[vars]
ENVIRONMENT = "core-qa"
CORE_QA_MODE = "cohort"
PAYMENT_MODE = "disabled"
PROMPTPAY_ENABLED = "false"
PAYMENT_PRODUCTION_POLICY_WRITES_ENABLED = "false"
FRONTEND_URLS = "http://localhost:5174,http://127.0.0.1:5174,http://localhost:8081,http://127.0.0.1:8081,http://localhost:8082,http://127.0.0.1:8082,http://localhost:8083,http://127.0.0.1:8083"
PUBLIC_ASSET_BASE_URL = "http://127.0.0.1:8787/api/uploads/public"
EMAIL_PROVIDER = "disabled"
EMAIL_FROM = "noreply@tirak.app"
EMAIL_FROM_NAME = "Tirak Core QA"
EMAIL_REPLY_TO = "support@tirak.app"
# JWT_SECRET is separately generated/provisioned for this Worker only.
# Email remains disabled until authorized recipient restriction is proven.
