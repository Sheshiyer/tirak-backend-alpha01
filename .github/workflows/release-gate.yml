name: Tirak backend release gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run release:verify

# T-021 prepares this workflow locally. No workflow is published or executed
# on GitHub until T-024 records separate human authorization.
