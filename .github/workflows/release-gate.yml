name: Tirak backend release gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: sudo apt-get update && sudo apt-get install --yes sqlite3
      - run: bun install --frozen-lockfile
      - run: bun run release:verify

# Source publication and this non-deploying CI run were authorized on 2026-09-19.
# Remote deployment, schema operations and payment activation remain separately gated.
